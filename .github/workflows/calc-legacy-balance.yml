name: Calculate legacy BuyByeBike balance

on:
  push:
    paths:
      - ".github/workflows/calc-legacy-balance.yml"

jobs:
  calculate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read old Firebase school-year balance
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("fs");

          (async () => {
            const source = fs.readFileSync("app.js", "utf8");
            const get = (name) => {
              const m = source.match(new RegExp(name + ':\\s*"([^"]+)"'));
              if (!m) throw new Error("Missing Firebase config: " + name);
              return m[1];
            };

            const API_KEY = get("apiKey");
            const PROJECT = get("projectId");
            const BASE = `https://firestore.googleapis.com/v1/projects/${PROJECT}/databases/(default)/documents`;

            async function anonToken() {
              const r = await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=${API_KEY}`, {
                method: "POST",
                headers: {"content-type": "application/json"},
                body: JSON.stringify({returnSecureToken: true})
              });
              if (!r.ok) throw new Error("Anonymous auth failed: " + r.status);
              return (await r.json()).idToken;
            }

            function scalar(v = {}) {
              if ("doubleValue" in v) return Number(v.doubleValue);
              if ("integerValue" in v) return Number(v.integerValue);
              if ("stringValue" in v) return v.stringValue;
              return null;
            }

            async function listCollection(token, path) {
              let docs = [];
              let pageToken = "";
              do {
                const u = new URL(`${BASE}/${path}`);
                u.searchParams.set("pageSize", "300");
                if (pageToken) u.searchParams.set("pageToken", pageToken);
                const r = await fetch(u, {headers: {Authorization: `Bearer ${token}`}});
                if (!r.ok) throw new Error(`Firestore read failed for ${path}: ${r.status}`);
                const j = await r.json();
                docs.push(...(j.documents || []));
                pageToken = j.nextPageToken || "";
              } while (pageToken);
              return docs;
            }

            const token = await anonToken();
            const rides = await listCollection(token, "families/larah-fae-mvt6umwe/children/larah-fae/rides");
            const payouts = await listCollection(token, "families/larah-fae-mvt6umwe/children/larah-fae/payouts");

            const start = "2026-03-02";
            const end = "2026-07-17";

            const validRides = rides.filter(d => {
              const dateId = scalar(d.fields?.dateId) || d.name.split("/").pop();
              return dateId >= start && dateId <= end;
            });

            const rideTotal = validRides.reduce((sum, d) => {
              return sum + Number(scalar(d.fields?.total) || 0);
            }, 0);

            const validPayouts = payouts.filter(d => {
              const date = scalar(d.fields?.payoutDate) || scalar(d.fields?.dateId) || "";
              return !date || (date >= start && date <= end);
            });

            const paidOut = validPayouts.reduce((sum, d) => {
              return sum + Math.abs(Number(scalar(d.fields?.amount) || 0));
            }, 0);

            const balance = rideTotal - paidOut;

            console.log("LEGACY_RIDE_COUNT=" + validRides.length);
            console.log("LEGACY_RIDE_TOTAL=" + rideTotal.toFixed(2));
            console.log("LEGACY_PAYOUT_COUNT=" + validPayouts.length);
            console.log("LEGACY_PAID_OUT=" + paidOut.toFixed(2));
            console.log("LEGACY_BALANCE=" + balance.toFixed(2));
          })().catch(err => {
            console.error(err);
            process.exit(1);
          });
          NODE
